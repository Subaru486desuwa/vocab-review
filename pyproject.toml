[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: 需要 MySQL 测试库（TEST_DB_*）"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 报告生成脚本主要是成段的中文正文与 XML 片段，不按 120 列折行。
"docs/reports/*.py" = ["E501"]

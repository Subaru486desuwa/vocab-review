[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: 需要 MySQL 测试库（TEST_DB_*）"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"
# 模型制品与原始数据不进 Git；非 Git 副本（如 scripts/handoff_check.sh）中 ruff 不读 .gitignore，需显式排除。
extend-exclude = [".venv", "artifacts", "data/raw", "data/processed"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# 报告生成脚本主要是成段的中文正文与 XML 片段，不按 120 列折行。
"docs/reports/*.py" = ["E501"]

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}词汇诊断与个性化复习{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">词汇研习室 <span>VOCAB REVIEW</span></a>
    <nav class="site-nav" aria-label="账户">
      {% set user = current_user() %}
      {% if user %}
        <a href="{{ url_for('learning.wordbooks_page') }}">目标词表</a>
        <a href="{{ url_for('learning.practice_page') }}">练习</a>
        <a href="{{ url_for('learning.review_page') }}">复习</a>
        <a href="{{ url_for('learning.dashboard') }}">{{ user.username }}</a>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit" class="link-button">退出</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login_page') }}">登录</a>
        <a href="{{ url_for('auth.register_page') }}">注册</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Flask · MySQL · 机器学习 · 深度学习</footer>
  {% block scripts %}{% endblock %}
</body>
</html>

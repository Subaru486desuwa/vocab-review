# 仅用于开发与本地演示。凭据来自 .env，见 .env.example。
name: vocab-review

services:
  db:
    image: mysql:8.4
    env_file: .env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      args:
        WITH_ML: "${WITH_ML:-1}"
        WITH_DL: "${WITH_DL:-1}"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      # 模型只从本地 artifacts/ 加载；下载编码器时用 -e HF_HUB_OFFLINE=0 临时放开。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    # 以宿主用户运行，挂载目录中生成的文件归属不变。
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
